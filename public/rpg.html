    // Helper render KaTeX an toàn
    function MathText({ text }) {
      const containerRef = useRef(null);
      useEffect(() => {
        if (containerRef.current && window.renderMathInElement) {
          try {
            window.renderMathInElement(containerRef.current, {
              delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$', right: '$', display: false }
              ],
              throwOnError: false
            });
          } catch (e) { }
        }
      }, [text]);

      return <span ref={containerRef} dangerouslySetInnerHTML={{ __html: text || '' }}></span>;
    }

    // Thuật toán chọn 3 thẻ kỹ năng ngẫu nhiên (Roguelite Draft)
    function generateRogueliteDraft(ownedSkills = [], adventureLevel = 1, milestone = 5) {
      const allKeys = Object.keys(RPG_SKILLS_DATABASE);
      const candidates = [];

      allKeys.forEach(k => {
        const sk = RPG_SKILLS_DATABASE[k];
        const owned = ownedSkills.find(s => s.id === k);
        if (owned) {
          if (owned.level < 3) {
            candidates.push({
              id: sk.id,
              name: sk.name,
              rarity: sk.rarity,
              icon: sk.icon,
              isUpgrade: true,
              targetLevel: owned.level + 1,
              desc: sk.levels[owned.level]?.desc || sk.levels[sk.levels.length - 1].desc,
              mpCost: sk.mpCost,
              type: sk.type
            });
          }
        } else {
          candidates.push({
            id: sk.id,
            name: sk.name,
            rarity: sk.rarity,
            icon: sk.icon,
            isUpgrade: false,
            targetLevel: 1,
            desc: sk.levels[0].desc,
            mpCost: sk.mpCost,
            type: sk.type
          });
        }
      });

      // Nếu ở mốc 25 (Huyền thoại): Ưu tiên các thẻ hiếm / huyền thoại
      if (milestone === 25) {
        candidates.sort((a, b) => {
          const rScore = { legendary: 4, epic: 3, rare: 2, common: 1 };
          return (rScore[b.rarity] || 1) - (rScore[a.rarity] || 1);
        });
      } else {
        candidates.sort(() => Math.random() - 0.5);
      }

      // Lấy 3 lựa chọn không trùng nhau
      const selected = [];
      for (const card of candidates) {
        if (!selected.some(c => c.id === card.id)) {
          selected.push(card);
          if (selected.length === 3) break;
        }
      }

      return selected;
    }

    function App() {

      const [hero, setHero] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { }
        }
        return defaultHeroState;
      });

      // Navigation:
      // Mode 1: 'landing' | 'create_char' | 'subject_select' | 'world_map' | 'battle' | 'victory' | 'profile' | 'inventory' | 'shop' | 'quests' | 'dashboard' | 'settings'
      // Mode 2 (Hành Trình 30 Câu): 'journey_select_set' | 'journey_select_map' | 'journey_select_hero' | 'journey_select_battle_type' | 'journey_battle' | 'journey_victory'
      const [screen, setScreen] = useState(() => hero.hasCreated ? 'landing' : 'landing');
      
      // Mode 1: Active Map Battle State
      const [stagePreview, setStagePreview] = useState(null);
      const [activeStage, setActiveStage] = useState(null);
      const [currentBattle, setCurrentBattle] = useState(null);
      const [battleVictoryData, setBattleVictoryData] = useState(null);
      const [heroAttackAnim, setHeroAttackAnim] = useState(false);
      const [monsterHitAnim, setMonsterHitAnim] = useState(false);
      const [showBattleBag, setShowBattleBag] = useState(false);
      const [openedChest, setOpenedChest] = useState(false);
      const [chestRewardItem, setChestRewardItem] = useState(null);

      // ==========================================
      // CHẾ ĐỘ 2: HÀNH TRÌNH 30 CÂU (STATE & SELECTION)
      // ==========================================
      const [publishedSets, setPublishedSets] = useState([]);
      const [loadingSets, setLoadingSets] = useState(false);
      const [journeySelectedSet, setJourneySelectedSet] = useState(null);
      const [journeySelectedMap, setJourneySelectedMap] = useState(BATTLE_MAPS[0]);
      const [journeySelectedHero, setJourneySelectedHero] = useState('warrior');
      const [journeyBattleType, setJourneyBattleType] = useState('solo_boss'); // 'solo_boss' | 'monster_journey'
      const [journeySelectedBoss, setJourneySelectedBoss] = useState(SOLO_BOSS_ROSTER[0]);
      const [journeySelectedPet, setJourneySelectedPet] = useState(COMPANION_PETS_DATA[0]);

      // Active Journey 30 Battle Session
      const [journeySession, setJourneySession] = useState(null);
      const [savedJourneyAvailable, setSavedJourneyAvailable] = useState(false);
      const [showWrongReviewModal, setShowWrongReviewModal] = useState(false);

      // Roguelite Skill Progression Modals & Effects
      const [showLevelUpModal, setShowLevelUpModal] = useState(false);
      const [levelUpCards, setLevelUpCards] = useState([]);
      const [levelUpMilestone, setLevelUpMilestone] = useState(5);
      const [showMysteryChestModal, setShowMysteryChestModal] = useState(false);
      const [bossPhaseNotice, setBossPhaseNotice] = useState(null);
      const [petAssistAnim, setPetAssistAnim] = useState(false);
      const [skillVfxAnim, setSkillVfxAnim] = useState(null);

      // ==========================================
      // HỆ THỐNG XÁC THỰC & ĐỒNG BỘ TÀI KHOẢN (AUTH & SECURE PROGRESSION)
      // ==========================================
      const [authUser, setAuthUser] = useState(window.EduQuestAuth ? window.EduQuestAuth.getUser() : null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authTab, setAuthTab] = useState('login'); // 'login' | 'register' | 'profile'
      const [loginForm, setLoginForm] = useState({ identifier: '', password: '' });
      const [regForm, setRegForm] = useState({ username: '', email: '', password: '', displayName: '', grade: 5 });
      const [pwForm, setPwForm] = useState({ currentPassword: '', newPassword: '' });
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      // Audio State
      const [isMusicOn, setIsMusicOn] = useState(true);
      const [isSfxOn, setIsSfxOn] = useState(true);

      // Tải dữ liệu cá nhân hóa từ Backend Database cho đúng tài khoản đăng nhập
      const loadServerPlayerData = async () => {
        if (!window.EduQuestAuth || !window.EduQuestAuth.isLoggedIn()) return;
        try {
          const res = await window.EduQuestAuth.getPlayerData();
          if (res && res.success && res.hasCharacter) {
            const d = res.data;
            setHero(prev => ({
              ...prev,
              name: d.character.name,
              heroClass: d.character.hero_class,
              level: d.character.level,
              exp: d.character.exp,
              maxExp: d.character.max_exp,
              gold: d.wallet.gold,
              gems: d.wallet.gems,
              activePetId: d.character.active_pet_id,
              unlockedPets: d.character.unlocked_pets,
              inventory: d.inventory,
              skills: d.skills.map(s => s.skill_id),
              currentStage: d.character.current_stage,
              unlockedStages: d.character.unlocked_stages,
              hasCreated: true
            }));
          }
        } catch (e) {
          console.error("Lỗi đồng bộ nhân vật server:", e);
        }
      };

      // Đăng ký listener khi auth thay đổi
      useEffect(() => {
        if (window.EduQuestAuth) {
          window.EduQuestAuth.onAuthChange((user) => {
            setAuthUser(user);
            if (user) {
              loadServerPlayerData();
            }
          });
          if (window.EduQuestAuth.isLoggedIn()) {
            loadServerPlayerData();
          }
        }
      }, []);

      const handleLoginSubmit = async (e) => {
        if (e) e.preventDefault();
        setAuthLoading(true);
        setAuthError('');
        setAuthSuccess('');
        try {
          const res = await window.EduQuestAuth.login(loginForm.identifier, loginForm.password);
          if (res.success) {
            setAuthSuccess('Đăng nhập thành công!');
            setTimeout(() => {
              setShowAuthModal(false);
              loadServerPlayerData();
            }, 500);
          } else {
            setAuthError(res.error || 'Đăng nhập thất bại!');
          }
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthLoading(false);
        }
      };

      const handleRegisterSubmit = async (e) => {
        if (e) e.preventDefault();
        setAuthLoading(true);
        setAuthError('');
        setAuthSuccess('');
        try {
          const res = await window.EduQuestAuth.register(regForm);
          if (res.success) {
            setAuthSuccess('Đăng ký tài khoản thành công!');
            setTimeout(() => {
              setShowAuthModal(false);
              loadServerPlayerData();
            }, 600);
          } else {
            setAuthError(res.error || 'Đăng ký thất bại!');
          }
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthLoading(false);
        }
      };

      const handleQuickLogin = async (identifier, password) => {
        setAuthLoading(true);
        setAuthError('');
        setAuthSuccess('');
        try {
          const res = await window.EduQuestAuth.login(identifier, password);
          if (res.success) {
            setAuthSuccess('Đăng nhập thành công!');
            setTimeout(() => {
              setShowAuthModal(false);
              loadServerPlayerData();
            }, 400);
          } else {
            setAuthError(res.error || 'Đăng nhập thất bại!');
          }
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        if (window.EduQuestAuth) {
          await window.EduQuestAuth.logout();
        }
        setHero({
          name: 'Tân Binh Khởi Đầu',
          heroClass: 'warrior',
          level: 1,
          exp: 0,
          maxExp: 100,
          gold: 200,
          gems: 10,
          activePetId: 'pet-dragon',
          unlockedPets: ['pet-dragon'],
          inventory: [],
          skills: ['song_kiem'],
          currentStage: 1,
          unlockedStages: 1,
          hasCreated: false
        });
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(JOURNEY_SESSION_KEY);
        setSavedJourneyAvailable(false);
        setScreen('landing');
      };

      // Tự động lưu hero vào LocalStorage
      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(hero));
      }, [hero]);

      // Kiểm tra xem có phiên hành trình 30 câu đang dở dang không
      useEffect(() => {
        const saved = localStorage.getItem(JOURNEY_SESSION_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.currentQIndex < 30 && parsed.setSnapshot) {
              setSavedJourneyAvailable(true);
            }
          } catch (e) { }
        }
      }, []);

      // Tải danh sách bộ câu hỏi đã xuất bản (cho Chế độ 2)
      const loadPublishedQuestionSets = async () => {
        setLoadingSets(true);
        try {
          const res = await fetch('/api/custom-question-sets?published=true');
          const data = await res.json();
          if (data.success) {
            setPublishedSets(data.data || []);
          }
        } catch (e) {
          console.error("Lỗi nạp bộ câu hỏi published:", e);
        } finally {
          setLoadingSets(false);
        }
      };

      // Quản lý BGM theo màn hình
      useEffect(() => {
        if (!isMusicOn) {
          window.rpgSound.stopBGM();
          return;
        }
        if (screen === 'battle' || screen === 'journey_battle') {
          const isBoss = activeStage?.isBoss || journeyBattleType === 'solo_boss';
          window.rpgSound.playBattleBGM(isBoss);
        } else {
          window.rpgSound.playTownBGM();
        }
      }, [screen, isMusicOn, activeStage, journeyBattleType]);

      // Tính toán tổng chỉ số (Base + Trang bị)
      const calculatedStats = useMemo(() => {
        const classData = window.RPG_DATA.classes[hero.heroClass] || window.RPG_DATA.classes.warrior;
        let atk = classData.baseStats.atk + (hero.level - 1) * 3;
        let def = classData.baseStats.def + (hero.level - 1) * 2;
        let maxHp = classData.baseStats.hp + (hero.level - 1) * 15;
        let maxMp = classData.baseStats.mp + (hero.level - 1) * 10;
        let spd = classData.baseStats.spd + (hero.level - 1) * 1;

        // Thêm bonus từ trang bị
        Object.values(hero.equipped).forEach(item => {
          if (item && item.statBonus) {
            if (item.statBonus.atk) atk += item.statBonus.atk;
            if (item.statBonus.def) def += item.statBonus.def;
            if (item.statBonus.hp) maxHp += item.statBonus.hp;
            if (item.statBonus.mp) maxMp += item.statBonus.mp;
            if (item.statBonus.spd) spd += item.statBonus.spd;
          }
        });

        // Thêm bonus từ Pet
        const activePet = window.RPG_DATA.pets.find(p => p.id === hero.activePetId);
        if (activePet && activePet.buffType === 'damageBonus') {
          atk = Math.round(atk * (1 + activePet.buffValue));
        }

        return { atk, def, maxHp, maxMp, spd };
      }, [hero.heroClass, hero.level, hero.equipped, hero.activePetId]);

      // ==========================================
      // CHẾ ĐỘ 1: PHIÊU LƯU BẢN ĐỒ (HANDLERS)
      // ==========================================
      const startBattle = (stage) => {
        window.rpgSound.playClick();
        setActiveStage(stage);
        setStagePreview(null);

        const questionsPool = window.QUESTIONS_BANK.filter(q => 
          q.subject === hero.currentSubject && q.worldId === hero.currentWorldId
        );
        const effectiveQuestions = questionsPool.length > 0 
          ? questionsPool 
          : window.QUESTIONS_BANK.filter(q => q.subject === hero.currentSubject);

        const shuffledQ = [...effectiveQuestions].sort(() => Math.random() - 0.5);

        setCurrentBattle({
          monster: { ...stage.monster },
          questions: shuffledQ,
          currentQIndex: 0,
          combo: 0,
          heroCurrentHp: calculatedStats.maxHp,
          heroCurrentMp: calculatedStats.maxMp,
          answeredRight: 0,
          answeredWrong: 0,
          isAnswered: false,
          selectedAnswer: null,
          isCorrect: null,
          showExplanation: false,
          isEnraged: false,
          damageAnimation: null
        });

        setShowBattleBag(false);
        setScreen('battle');
      };

      const handleAnswer = (choice) => {
        if (!currentBattle || currentBattle.isAnswered) return;
        const currentQ = currentBattle.questions[currentBattle.currentQIndex];
        const isRight = (choice === currentQ.correctAnswer);

        window.rpgSound.playClick();

        if (isRight) {
          const newCombo = currentBattle.combo + 1;
          const isCrit = newCombo >= 3 || Math.random() < 0.25;
          let damage = Math.round(currentQ.damage * (1 + (calculatedStats.atk / 40)));
          if (isCrit) damage = Math.round(damage * 1.6);

          setHeroAttackAnim(true);
          setTimeout(() => setHeroAttackAnim(false), 500);

          if (hero.heroClass === 'warrior') window.rpgSound.playSlash();
          else if (hero.heroClass === 'mage') window.rpgSound.playMagic();
          else window.rpgSound.playArrow();

          if (isCrit) window.rpgSound.playCriticalHit();

          if (window.battleFx) {
            window.battleFx.triggerMobileSlashAnimation(hero.heroClass, isCrit);
          }

          setTimeout(() => {
            setMonsterHitAnim(true);
            setTimeout(() => setMonsterHitAnim(false), 550);
          }, 200);

          const remainingMonsterHp = Math.max(0, currentBattle.monster.hp - damage);
          const isPhase2 = activeStage.isBoss && remainingMonsterHp <= (currentBattle.monster.phase2Hp || 0);

          let healedHp = currentBattle.heroCurrentHp;
          const activePet = window.RPG_DATA.pets.find(p => p.id === hero.activePetId);
          if (activePet && activePet.buffType === 'healOnCorrect') {
            healedHp = Math.min(calculatedStats.maxHp, healedHp + activePet.buffValue);
          }

          setHero(prev => {
            const nextStats = { ...prev.studyStats };
            nextStats.totalAnswered += 1;
            nextStats.totalCorrect += 1;
            nextStats.subjectCorrectCounts[prev.currentSubject] = (nextStats.subjectCorrectCounts[prev.currentSubject] || 0) + 1;
            nextStats.subjectTotalCounts[prev.currentSubject] = (nextStats.subjectTotalCounts[prev.currentSubject] || 0) + 1;
            return { ...prev, studyStats: nextStats };
          });

          setCurrentBattle(prev => ({
            ...prev,
            isAnswered: true,
            selectedAnswer: choice,
            isCorrect: true,
            combo: newCombo,
            heroCurrentHp: healedHp,
            answeredRight: prev.answeredRight + 1,
            monster: { ...prev.monster, hp: remainingMonsterHp },
            isEnraged: isPhase2,
            damageAnimation: { text: isCrit ? `💥 CHÍ MẠNG -${damage}!` : `-${damage}`, isCrit }
          }));

          if (remainingMonsterHp <= 0) {
            setTimeout(() => {
              handleBattleVictory();
            }, 1200);
          } else {
            setTimeout(() => {
              advanceToNextQuestion();
            }, 1600);
          }
        } else {
          window.rpgSound.playPlayerHurt();
          const monsterAtk = Math.max(8, (currentBattle.monster.atk || 15) - Math.round(calculatedStats.def / 3));
          const remainingHeroHp = Math.max(1, currentBattle.heroCurrentHp - monsterAtk);

          setHero(prev => {
            const nextStats = { ...prev.studyStats };
            nextStats.totalAnswered += 1;
            nextStats.subjectTotalCounts[prev.currentSubject] = (nextStats.subjectTotalCounts[prev.currentSubject] || 0) + 1;
            if (!nextStats.weakQuestions.includes(currentQ.question)) {
              nextStats.weakQuestions.push(currentQ.question);
            }
            return { ...prev, studyStats: nextStats };
          });

          setCurrentBattle(prev => ({
            ...prev,
            isAnswered: true,
            selectedAnswer: choice,
            isCorrect: false,
            combo: 0,
            showExplanation: true,
            answeredWrong: prev.answeredWrong + 1,
            heroCurrentHp: remainingHeroHp,
            damageAnimation: { text: `Quái phản công: -${monsterAtk} HP!`, isMonster: true }
          }));
        }
      };

      const advanceToNextQuestion = () => {
        setCurrentBattle(prev => {
          if (!prev) return null;
          const nextIdx = (prev.currentQIndex + 1) % prev.questions.length;
          return {
            ...prev,
            currentQIndex: nextIdx,
            isAnswered: false,
            selectedAnswer: null,
            isCorrect: null,
            showExplanation: false,
            damageAnimation: null
          };
        });
      };

      const handleBattleVictory = () => {
        window.rpgSound.playVictory();
        confetti({ particleCount: 180, spread: 100, origin: { y: 0.6 } });

        let expEarned = activeStage.monster.expReward || 40;
        let goldEarned = activeStage.monster.goldReward || 30;
        const gemEarned = activeStage.monster.gemReward || (activeStage.isBoss ? 15 : 2);

        const activePet = window.RPG_DATA.pets.find(p => p.id === hero.activePetId);
        if (activePet) {
          if (activePet.buffType === 'goldBonus') goldEarned = Math.round(goldEarned * (1 + activePet.buffValue));
          if (activePet.buffType === 'expBonus') expEarned = Math.round(expEarned * (1 + activePet.buffValue));
        }

        const newCompleted = [...new Set([...hero.completedStages, activeStage.id])];

        let newExp = hero.exp + expEarned;
        let newLevel = hero.level;
        let newMaxExp = hero.maxExp;
        let didLevelUp = false;

        if (newExp >= newMaxExp) {
          newLevel += 1;
          newExp -= newMaxExp;
          newMaxExp = Math.round(newMaxExp * 1.35);
          didLevelUp = true;
          window.rpgSound.playLevelUp();
        }

        setHero(prev => ({
          ...prev,
          level: newLevel,
          exp: newExp,
          maxExp: newMaxExp,
          gold: prev.gold + goldEarned,
          gems: prev.gems + gemEarned,
          completedStages: newCompleted,
          studyStats: {
            ...prev.studyStats,
            bossesDefeated: activeStage.isBoss ? prev.studyStats.bossesDefeated + 1 : prev.studyStats.bossesDefeated
          }
        }));

        setOpenedChest(false);
        setChestRewardItem(null);

        setBattleVictoryData({
          stageName: activeStage.name,
          monsterName: activeStage.monster.name,
          isBoss: activeStage.isBoss,
          expEarned,
          goldEarned,
          gemEarned,
          didLevelUp,
          newLevel,
          accuracy: Math.round((currentBattle.answeredRight / Math.max(1, currentBattle.answeredRight + currentBattle.answeredWrong)) * 100)
        });

        // Đồng bộ phần thưởng ải lên backend server
        if (window.EduQuestAuth && window.EduQuestAuth.isLoggedIn() && activeStage) {
          const runId = `stage_${activeStage.id}_${Date.now()}`;
          window.EduQuestAuth.claimMilestoneReward(runId, 1, goldEarned, expEarned, null, activeStage.isBoss ? 'Huy Hiệu Trảm Boss' : null).then(() => {
            loadServerPlayerData();
          }).catch(console.error);
        }

        setScreen('victory');
      };

      // ==========================================
      // CHẾ ĐỘ 2: HÀNH TRÌNH 30 CÂU (HANDLERS)
      // ==========================================

      // Khởi động Hành trình 30 câu mới
      const startJourneyAdventure = async () => {
        window.rpgSound.playClick();
        if (!journeySelectedSet) {
          alert("Vui lòng chọn 1 bộ câu hỏi!");
          return;
        }

        // Tải toàn bộ chi tiết 30 câu hỏi của bộ đã chọn
        setLoadingSets(true);
        try {
          const res = await fetch(`/api/custom-question-sets/${journeySelectedSet.id}`);
          const data = await res.json();
                    if (!data.success || !data.data || !Array.isArray(data.data.questions) || data.data.questions.length === 0) {
            alert("Bộ câu hỏi này chưa có câu hỏi nào! Vui lòng vào trang Quản Lý để thêm câu hỏi.");
            return;
          }

          const setFull = data.data;

          // Tự động đảm bảo 30 câu: nếu ít hơn 30 câu thì lặp vòng để đủ 30 lượt trận chiến
          let effectiveQuestions = [...setFull.questions];
          if (effectiveQuestions.length < 30) {
            const originalLen = effectiveQuestions.length;
            while (effectiveQuestions.length < 30) {
              const clone = JSON.parse(JSON.stringify(effectiveQuestions[effectiveQuestions.length % originalLen]));
              clone.id = `${clone.id}-cycle-${effectiveQuestions.length}`;
              effectiveQuestions.push(clone);
            }
          } else if (effectiveQuestions.length > 30) {
            effectiveQuestions = effectiveQuestions.slice(0, 30);
          }

          // Thiết lập quái vật khởi đầu
          let initialMonster;
          if (journeyBattleType === 'solo_boss') {
            initialMonster = {
              name: journeySelectedBoss.name,
              image: journeySelectedBoss.image,
              hp: journeySelectedBoss.baseHp,
              maxHp: journeySelectedBoss.baseHp,
              atk: journeySelectedBoss.atk,
              isBoss: true,
              phase: 1
            };
          } else {
            const firstCfg = MONSTER_JOURNEY_SEQUENCE[0];
            initialMonster = {
              name: firstCfg.name,
              image: firstCfg.image,
              hp: firstCfg.hp,
              maxHp: firstCfg.hp,
              atk: firstCfg.atk,
              isBoss: firstCfg.isBoss,
              phase: 1
            };
          }

          // Khởi tạo kỹ năng khởi đầu (Level 1 Starter Skill)
          const starterSkillId = journeySelectedHero === 'warrior' 
            ? 'song_kiem' 
            : (journeySelectedHero === 'mage' ? 'hoa_cau' : 'mua_ten');

          const initialSession = {
            setId: setFull.id,
            setTitle: setFull.title,
            setTopic: setFull.topic,
            subject: setFull.subject,
            grade: setFull.grade,
            setSnapshot: typeof effectiveQuestions !== "undefined" ? effectiveQuestions : setFull.questions, // Snapshot 30 câu
            map: journeySelectedMap,
            heroClass: journeySelectedHero,
            pet: journeySelectedPet || COMPANION_PETS_DATA[0],
            petEvolution: 1,
            battleType: journeyBattleType,
            monster: initialMonster,
            currentQIndex: 0,
            answersHistory: [],
            combo: 0,
            adventureLevel: 1, // Bắt đầu ở Adventure Level 1
            heroCurrentHp: calculatedStats.maxHp,
            heroCurrentMp: 50, // MP ban đầu
            heroMaxMp: 100,
            skills: [
              { id: starterSkillId, level: 1, active: true }
            ],
            selectedActiveSkill: starterSkillId,
            insightCharges: 3,
            shieldActive: false,
            phoenixUsed: false,
            monsterFrozen: false,
            claimedMilestones: [],
            eliminatedOptions: [],
            accumulatedGold: 0,
            accumulatedExp: 0,
            correctCount: 0,
            wrongCount: 0,
            startTime: Date.now(),
            runId: 'journey_' + Date.now(),
            isAnswered: false,
            selectedAnswer: null,
            isCorrect: null,
            showExplanation: false,
            autoAdvance: false,
            damageAnimation: null
          };

          setJourneySession(initialSession);
          localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(initialSession));
          setSavedJourneyAvailable(false);
          setShowBattleBag(false);
          setScreen('journey_battle');

        } catch (e) {
          alert("Lỗi khởi tạo hành trình: " + e.message);
        } finally {
          setLoadingSets(false);
        }
      };

      // Khôi phục hành trình đã lưu trong LocalStorage
      const resumeSavedJourney = () => {
        window.rpgSound.playClick();
        const saved = localStorage.getItem(JOURNEY_SESSION_KEY);
        if (!saved) return;
        try {
          const parsed = JSON.parse(saved);
          setJourneySession(parsed);
          setSavedJourneyAvailable(false);
          setScreen('journey_battle');
        } catch (e) {
          alert("Không thể khôi phục phiên chơi: " + e.message);
        }
      };

      // Hủy phiên chơi đã lưu
      const discardSavedJourney = () => {
        if (confirm("Bạn có chắc chắn muốn hủy bỏ hành trình đang dở dang này?")) {
          localStorage.removeItem(JOURNEY_SESSION_KEY);
          setSavedJourneyAvailable(false);
        }
      };

      // Dùng quyền trợ giúp "Nhìn Thấu" (50:50 Insight)
      const useClairvoyanceInsight = () => {
        if (!journeySession || journeySession.isAnswered) return;
        const currentQ = journeySession.setSnapshot[journeySession.currentQIndex];
        if (!currentQ || !currentQ.options || currentQ.options.length < 4) return;

        const charges = journeySession.insightCharges ?? 3;
        if (charges <= 0) {
          alert("Bạn đã sử dụng hết lượt Nhìn Thấu trong hành trình này!");
          return;
        }

        if (journeySession.eliminatedOptions && journeySession.eliminatedOptions.length > 0) {
          return; // Đã loại bỏ rồi
        }

        const incorrectOptions = currentQ.options.filter(opt => opt !== currentQ.correctAnswer);
        const shuffled = [...incorrectOptions].sort(() => Math.random() - 0.5);
        const toEliminate = shuffled.slice(0, 2);

        window.rpgSound.playMagic();

        setJourneySession(prev => {
          const updated = {
            ...prev,
            insightCharges: charges - 1,
            eliminatedOptions: toEliminate
          };
          localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(updated));
          return updated;
        });
      };

      // Dùng kỹ năng Hồi Phục (Active Heal)
      const useHealSkill = () => {
        if (!journeySession) return;
        const healSkill = journeySession.skills?.find(s => s.id === 'hoi_phuc');
        if (!healSkill) {
          alert("Bạn chưa mở khóa kỹ năng Hồi Phục!");
          return;
        }
        const mpCost = RPG_SKILLS_DATABASE.hoi_phuc.mpCost;
        if ((journeySession.heroCurrentMp || 0) < mpCost) {
          alert(`Không đủ MP! Cần ${mpCost} MP để kích hoạt Hồi Phục.`);
          return;
        }
        const healPercent = RPG_SKILLS_DATABASE.hoi_phuc.levels[healSkill.level - 1]?.healPercent || 0.20;
        const healAmount = Math.round(calculatedStats.maxHp * healPercent);
        const newHp = Math.min(calculatedStats.maxHp, journeySession.heroCurrentHp + healAmount);
        const newMp = journeySession.heroCurrentMp - mpCost;

        window.rpgSound.playHeal();

        setJourneySession(prev => {
          const updated = {
            ...prev,
            heroCurrentHp: newHp,
            heroCurrentMp: newMp,
            damageAnimation: { text: `+${healAmount} HP! 💚`, isMonster: false }
          };
          localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(updated));
          return updated;
        });
      };

      // Kích hoạt Khiên Tri Thức
      const activateKnowledgeShield = () => {
        if (!journeySession) return;
        const shieldSkill = journeySession.skills?.find(s => s.id === 'khien_tri_thuc');
        if (!shieldSkill) {
          alert("Bạn chưa mở khóa Khiên Tri Thức!");
          return;
        }
        if (journeySession.shieldActive) {
          alert("Khiên Tri Thức đang được kích hoạt bảo vệ!");
          return;
        }
        const mpCost = RPG_SKILLS_DATABASE.khien_tri_thuc.mpCost;
        if ((journeySession.heroCurrentMp || 0) < mpCost) {
          alert(`Không đủ MP! Cần ${mpCost} MP để tạo Khiên Tri Thức.`);
          return;
        }

        window.rpgSound.playShield();

        setJourneySession(prev => {
          const updated = {
            ...prev,
            heroCurrentMp: prev.heroCurrentMp - mpCost,
            shieldActive: true,
            damageAnimation: { text: `🛡️ KHIÊN TRI THỨC KÍCH HOẠT!`, isMonster: false }
          };
          localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(updated));
          return updated;
        });
      };

      // Bật/tắt chọn kỹ năng tấn công chủ động (Offensive Active Skill Toggle)
      const toggleActiveSkill = (skillId) => {
        if (!journeySession) return;
        window.rpgSound.playClick();
        setJourneySession(prev => {
          const isSame = prev.selectedActiveSkill === skillId;
          const nextActive = isSame ? null : skillId;
          const updated = { ...prev, selectedActiveSkill: nextActive };
          localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(updated));
          return updated;
        });
      };

      // Chọn Thẻ Kỹ Năng trong Roguelite Draft
      const selectDraftCard = (card) => {
        window.rpgSound.playDraftSelect();
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.5 } });

        // Gửi ghi nhận mốc phần thưởng và kỹ năng an toàn lên backend
        if (window.EduQuestAuth && window.EduQuestAuth.isLoggedIn() && journeySession) {
          const runId = journeySession.runId || ('journey_' + journeySession.startTime);
          window.EduQuestAuth.claimMilestoneReward(runId, levelUpMilestone || 5, 20, 30, card.id, null).catch(err => {
            console.warn("Milestone reward notification:", err);
          });
        }

        setJourneySession(prev => {
          let nextSkills = [...(prev.skills || [])];
          const existingIdx = nextSkills.findIndex(s => s.id === card.id);

          if (existingIdx >= 0) {
            nextSkills[existingIdx] = {
              ...nextSkills[existingIdx],
              level: card.targetLevel
            };
          } else {
            nextSkills.push({
              id: card.id,
              level: 1,
              active: card.type === 'active' || card.type === 'active_buff'
            });
          }

          const updated = {
            ...prev,
            skills: nextSkills,
            selectedActiveSkill: (card.type === 'active' || card.type === 'active_buff') ? card.id : prev.selectedActiveSkill
          };
          localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(updated));
          return updated;
        });

        setShowLevelUpModal(false);

        // Sau khi chọn xong, tiến sang câu tiếp theo
        const nextQIndex = journeySession.currentQIndex + 1;
        if (nextQIndex < 30) {
          moveToNextQuestionIndex(nextQIndex);
        } else {
          handleJourneyComplete();
        }
      };

      // Chọn Phần Thưởng trong Rương Báu Bí Ẩn (Mốc 15)
      const selectMysteryChestReward = (choiceType) => {
        window.rpgSound.playChestOpen();
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });

        // Ghi nhận mốc 15 lên backend
        if (window.EduQuestAuth && window.EduQuestAuth.isLoggedIn() && journeySession) {
          const runId = journeySession.runId || ('journey_' + journeySession.startTime);
          const rewardItemName = choiceType === 'elixir' ? 'Tiên Dược Đại Hồi Phục' : (choiceType === 'pet_evolution' ? 'Đá Tiến Hóa Thú Cưng' : 'Ngọc Nhãn Quang');
          window.EduQuestAuth.claimMilestoneReward(runId, 15, 50, 60, null, rewardItemName).catch(err => {
            console.warn("Milestone 15 claim notification:", err);
          });
        }

        setJourneySession(prev => {
          let updated = { ...prev };
          if (choiceType === 'elixir') {
            updated.heroCurrentHp = calculatedStats.maxHp;
            updated.heroCurrentMp = 100;
            updated.damageAnimation = { text: '💚 TIÊN DƯỢC: HỒI PHỤC TOÀN BỘ HP & MP!', isMonster: false };
          } else if (choiceType === 'pet_evolution') {
            updated.petEvolution = 2;
            updated.damageAnimation = { text: '✨ THÚ CƯNG TIẾN HÓA BẬC 2!', isMonster: false };
          } else if (choiceType === 'insight_boost') {
            updated.insightCharges = (updated.insightCharges || 0) + 3;
            updated.damageAnimation = { text: '👁️ +3 LƯỢT DÙNG NHÌN THẤU!', isMonster: false };
          }
          localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(updated));
          return updated;
        });

        setShowMysteryChestModal(false);

        // Tiến sang câu tiếp theo
        const nextQIndex = journeySession.currentQIndex + 1;
        if (nextQIndex < 30) {
          moveToNextQuestionIndex(nextQIndex);
        } else {
          handleJourneyComplete();
        }
      };

      // Mở modal Level Up
      const triggerLevelUpEvent = (milestone, targetLevel) => {
        window.rpgSound.playLevelUp();
        const cards = generateRogueliteDraft(journeySession.skills || [], targetLevel, milestone);
        setLevelUpCards(cards);
        setLevelUpMilestone(milestone);
        setShowLevelUpModal(true);

        const updated = {
          ...journeySession,
          claimedMilestones: [...(journeySession.claimedMilestones || []), milestone],
          adventureLevel: targetLevel
        };
        setJourneySession(updated);
        localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(updated));
      };

      // Mở modal Rương Báu Bí Ẩn (Mốc 15)
      const triggerMysteryChestEvent = (milestone, targetLevel) => {
        window.rpgSound.playChestOpen();
        setShowMysteryChestModal(true);

        const updated = {
          ...journeySession,
          claimedMilestones: [...(journeySession.claimedMilestones || []), milestone],
          adventureLevel: targetLevel
        };
        setJourneySession(updated);
        localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(updated));
      };

      // Chuyển câu hỏi nội bộ
      const moveToNextQuestionIndex = (nextIndex) => {
        let currentMon = journeySession.monster;
        if (journeySession.battleType === 'monster_journey') {
          const cfg = MONSTER_JOURNEY_SEQUENCE.find(m => nextIndex >= m.minQ && nextIndex <= m.maxQ) || MONSTER_JOURNEY_SEQUENCE[MONSTER_JOURNEY_SEQUENCE.length - 1];
          if (cfg.name !== currentMon.name) {
            currentMon = {
              name: cfg.name,
              image: cfg.image,
              hp: cfg.hp,
              maxHp: cfg.hp,
              atk: cfg.atk,
              isBoss: cfg.isBoss,
              phase: 1
            };
          }
        }

        const nextSession = {
          ...journeySession,
          currentQIndex: nextIndex,
          monster: currentMon,
          isAnswered: false,
          selectedAnswer: null,
          isCorrect: null,
          eliminatedOptions: [],
          showExplanation: false,
          damageAnimation: null
        };

        setJourneySession(nextSession);
        localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(nextSession));
      };

      // Xử lý nộp đáp án trong Hành trình 30 câu
      const handleJourneyAnswer = (choice) => {
        if (!journeySession || journeySession.isAnswered) return;
        const currentQ = journeySession.setSnapshot[journeySession.currentQIndex];
        const isRight = (choice === currentQ.correctAnswer);

        window.rpgSound.playClick();

        if (isRight) {
          // Trả lời đúng
          const newCombo = journeySession.combo + 1;
          const isCrit = newCombo >= 3 || Math.random() < 0.25;
          let baseDamage = Math.round((currentQ.damage || 35) * (1 + (calculatedStats.atk / 35)));
          if (isCrit) baseDamage = Math.round(baseDamage * 1.6);
          if (newCombo >= 10) baseDamage = Math.round(baseDamage * 2.2);

          // Kiểm tra kỹ năng chủ động đang chọn
          let activeSkillUsed = null;
          let skillMultiplier = 1.0;
          let skillBonusDmg = 0;
          let freezeTriggered = false;

          const activeSkillId = journeySession.selectedActiveSkill;
          const ownedActive = journeySession.skills?.find(s => s.id === activeSkillId);

          if (ownedActive && RPG_SKILLS_DATABASE[activeSkillId]) {
            const meta = RPG_SKILLS_DATABASE[activeSkillId];
            const lvData = meta.levels[ownedActive.level - 1] || meta.levels[0];

            if ((journeySession.heroCurrentMp || 0) >= meta.mpCost) {
              activeSkillUsed = activeSkillId;
              if (activeSkillId === 'song_kiem') {
                skillMultiplier = lvData.multiplier || 1.5;
                window.rpgSound.playSlash();
                setSkillVfxAnim({ type: 'dual_slash' });
              } else if (activeSkillId === 'hoa_cau') {
                skillBonusDmg = lvData.bonusDmg || 45;
                window.rpgSound.playFireball();
                setSkillVfxAnim({ type: 'fireball' });
              } else if (activeSkillId === 'mua_ten') {
                skillMultiplier = lvData.multiplier || 1.6;
                window.rpgSound.playArrow();
                setSkillVfxAnim({ type: 'arrow_rain' });
              } else if (activeSkillId === 'bang_gia') {
                freezeTriggered = true;
                skillBonusDmg = lvData.bonusDmg || 30;
                window.rpgSound.playIceFreeze();
                setSkillVfxAnim({ type: 'frost' });
              } else if (activeSkillId === 'sam_set') {
                skillBonusDmg = lvData.bonusDmg || 55;
                window.rpgSound.playThunder();
                setSkillVfxAnim({ type: 'lightning' });
              }
              setTimeout(() => setSkillVfxAnim(null), 700);
            }
          }

          if (!activeSkillUsed) {
            if (journeySession.heroClass === 'warrior') window.rpgSound.playSlash();
            else if (journeySession.heroClass === 'mage') window.rpgSound.playMagic();
            else window.rpgSound.playArrow();
          }

          if (isCrit) window.rpgSound.playCriticalHit();

          setHeroAttackAnim(true);
          setTimeout(() => setHeroAttackAnim(false), 500);

          if (window.battleFx) {
            window.battleFx.triggerMobileSlashAnimation(journeySession.heroClass, isCrit);
          }

          setTimeout(() => {
            setMonsterHitAnim(true);
            setTimeout(() => setMonsterHitAnim(false), 550);
          }, 200);

          let totalDamage = Math.round(baseDamage * skillMultiplier + skillBonusDmg);

          // Cập nhật MP: Hồi phục +15 MP cơ bản
          let nextMp = Math.min(100, (journeySession.heroCurrentMp || 50) + 15);
          if (activeSkillUsed) {
            nextMp = Math.max(0, nextMp - RPG_SKILLS_DATABASE[activeSkillUsed].mpCost);
          }

          // Kiểm tra Thú cưng hỗ trợ (sau mỗi 3 câu đúng hoặc có skill thu_cung_ho_tro)
          let petAssistTriggered = false;
          let petBonusDamage = 0;
          const nextCorrectCount = journeySession.correctCount + 1;
          const hasPetSkill = journeySession.skills?.some(s => s.id === 'thu_cung_ho_tro');

          if (hasPetSkill || (nextCorrectCount % 3 === 0)) {
            petAssistTriggered = true;
            setPetAssistAnim(true);
            setTimeout(() => setPetAssistAnim(false), 700);
            window.rpgSound.playPetAssist();

            const pId = journeySession.pet?.id || 'pet-dragon';
            const evo = journeySession.petEvolution || 1;
            if (pId === 'pet-dragon') {
              petBonusDamage = 35 * evo;
              totalDamage += petBonusDamage;
            } else if (pId === 'pet-fox') {
              nextMp = Math.min(100, nextMp + (25 * evo));
            } else if (pId === 'pet-wolf') {
              petBonusDamage = 25 * evo;
              totalDamage += petBonusDamage;
            }
          }

          // Trừ máu quái
          let nextMonsterHp = Math.max(0, journeySession.monster.hp - totalDamage);
          let updatedMonster = { ...journeySession.monster, hp: nextMonsterHp };

          // Xử lý chuyển đổi quái vật / Hồi sinh Boss nếu hết máu sớm (đảm bảo đủ 30 câu)
          if (nextMonsterHp <= 0) {
            if (journeySession.battleType === 'solo_boss') {
              const nextPhase = (journeySession.monster.phase || 1) + 1;
              updatedMonster = {
                ...journeySession.monster,
                phase: nextPhase,
                hp: Math.round(journeySelectedBoss.baseHp * 0.8),
                maxHp: Math.round(journeySelectedBoss.baseHp * 0.8),
                atk: journeySession.monster.atk + 4,
                isEnraged: true
              };
            } else {
              const nextQ = journeySession.currentQIndex + 1;
              const nextCfg = MONSTER_JOURNEY_SEQUENCE.find(m => nextQ >= m.minQ && nextQ <= m.maxQ) || MONSTER_JOURNEY_SEQUENCE[MONSTER_JOURNEY_SEQUENCE.length - 1];
              updatedMonster = {
                name: nextCfg.name,
                image: nextCfg.image,
                hp: nextCfg.hp,
                maxHp: nextCfg.hp,
                atk: nextCfg.atk,
                isBoss: nextCfg.isBoss,
                phase: 1
              };
            }
          }

          const goldGain = Math.round(15 * (1 + newCombo * 0.1));
          const expGain = Math.round(25 * (1 + newCombo * 0.1));

          const historyEntry = {
            qIndex: journeySession.currentQIndex,
            question: currentQ.question,
            options: currentQ.options,
            chosenAnswer: choice,
            correctAnswer: currentQ.correctAnswer,
            isCorrect: true,
            usedHint: (journeySession.eliminatedOptions && journeySession.eliminatedOptions.length > 0),
            skillUsed: activeSkillUsed ? RPG_SKILLS_DATABASE[activeSkillUsed].name : null,
            petAssisted: petAssistTriggered,
            explanation: currentQ.explanation
          };

          let damageText = `-${totalDamage}`;
          if (activeSkillUsed) damageText = `⚡ ${RPG_SKILLS_DATABASE[activeSkillUsed].name.toUpperCase()} -${totalDamage}!`;
          else if (isCrit) damageText = `💥 CHÍ MẠNG -${totalDamage}!`;

          const nextSession = {
            ...journeySession,
            isAnswered: true,
            selectedAnswer: choice,
            isCorrect: true,
            combo: newCombo,
            correctCount: nextCorrectCount,
            heroCurrentMp: nextMp,
            monsterFrozen: freezeTriggered,
            accumulatedGold: journeySession.accumulatedGold + goldGain,
            accumulatedExp: journeySession.accumulatedExp + expGain,
            monster: updatedMonster,
            answersHistory: [...journeySession.answersHistory, historyEntry],
            damageAnimation: { text: damageText, isCrit, skillName: activeSkillUsed }
          };

          setJourneySession(nextSession);
          localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(nextSession));

          if (journeySession.autoAdvance) {
            setTimeout(() => {
              advanceToNextJourneyQuestion();
            }, 2200);
          }

        } else {
          // Trả lời sai
          let monsterAtk = Math.max(10, (journeySession.monster.atk || 18) - Math.round(calculatedStats.def / 3));
          let damageNotice = '';

          if (journeySession.shieldActive) {
            monsterAtk = 0;
            damageNotice = '🛡️ KHIÊN TRI THỨC ĐÃ CHẶN ĐÒN PHẢN CÔNG!';
            window.rpgSound.playShield();
          } else if (journeySession.monsterFrozen) {
            monsterAtk = 0;
            damageNotice = '❄️ QUÁI VẬT BỊ ĐÓNG BĂNG! KHÔNG THỂ PHẢN CÔNG!';
            window.rpgSound.playIceFreeze();
          } else {
            window.rpgSound.playPlayerHurt();
            damageNotice = `Quái phản công: -${monsterAtk} HP!`;
          }

          let remainingHeroHp = journeySession.heroCurrentHp - monsterAtk;
          let phoenixTriggered = false;

          if (remainingHeroHp <= 0) {
            const hasPhoenix = journeySession.skills?.some(s => s.id === 'phuong_hoang');
            if (hasPhoenix && !journeySession.phoenixUsed) {
              phoenixTriggered = true;
              remainingHeroHp = Math.round(calculatedStats.maxHp * 0.35);
              damageNotice = '🔥 PHƯỢNG HOÀNG HỘ MỆNH: HỒI SINH DŨNG SĨ!';
              window.rpgSound.playDraftSelect();
            } else {
              remainingHeroHp = Math.round(calculatedStats.maxHp * 0.30);
              damageNotice = '🌟 ÁNH SÁNG PHỤC HỒI: Hồi phục 30% HP để tiếp tục luyện tập!';
            }
          }

          const historyEntry = {
            qIndex: journeySession.currentQIndex,
            question: currentQ.question,
            options: currentQ.options,
            chosenAnswer: choice,
            correctAnswer: currentQ.correctAnswer,
            isCorrect: false,
            usedHint: (journeySession.eliminatedOptions && journeySession.eliminatedOptions.length > 0),
            explanation: currentQ.explanation
          };

          const nextSession = {
            ...journeySession,
            isAnswered: true,
            selectedAnswer: choice,
            isCorrect: false,
            combo: 0,
            showExplanation: true,
            wrongCount: journeySession.wrongCount + 1,
            heroCurrentHp: remainingHeroHp,
            shieldActive: false, // Khiên vỡ sau khi chặn
            monsterFrozen: false, // Băng tan sau lượt
            phoenixUsed: journeySession.phoenixUsed || phoenixTriggered,
            answersHistory: [...journeySession.answersHistory, historyEntry],
            damageAnimation: { text: damageNotice, isMonster: true }
          };

          setJourneySession(nextSession);
          localStorage.setItem(JOURNEY_SESSION_KEY, JSON.stringify(nextSession));
        }
      };

      // Chuyển sang câu hỏi kế tiếp trong hành trình 30 câu
      const advanceToNextJourneyQuestion = () => {
        if (!journeySession) return;
        const completedQuestions = journeySession.currentQIndex + 1; // Số câu đã làm

        // 1. KIỂM TRA MỐC NÂNG CẤP LEVEL UP & SỰ KIỆN GIỮA HÀNH TRÌNH
        const claimed = journeySession.claimedMilestones || [];

        // Mốc 1: Sau câu 5 -> Level 2
        if (completedQuestions === 5 && !claimed.includes(5)) {
          triggerLevelUpEvent(5, 2);
          return;
        }

        // Mốc 2: Sau câu 10 -> Level 3 & Thử thách Boss Stage 1
        if (completedQuestions === 10 && !claimed.includes(10)) {
          setBossPhaseNotice("👑 THỬ THÁCH TINH ANH: BOSS GIAI ĐOẠN 1 TRỖI DẬY!");
          setTimeout(() => setBossPhaseNotice(null), 3500);
          triggerLevelUpEvent(10, 3);
          return;
        }

        // Mốc 3: Sau câu 15 -> Level 4 & Rương Báu Bí Ẩn / Tiến Hóa Thú Cưng
        if (completedQuestions === 15 && !claimed.includes(15)) {
          triggerMysteryChestEvent(15, 4);
          return;
        }

        // Mốc 4: Sau câu 20 -> Level 5 & Boss Cuồng Bạo (Enraged Form)
        if (completedQuestions === 20 && !claimed.includes(20)) {
          setBossPhaseNotice("⚠️ CẢNH BÁO: BOSS BƯỚC VÀO TRẠNG THÁI CUỒNG BẠO GIAI ĐOẠN 2!");
          setTimeout(() => setBossPhaseNotice(null), 3500);
          triggerLevelUpEvent(20, 5);
          return;
        }

        // Mốc 5: Sau câu 25 -> Level 6 & Sức Mạnh Huyền Thoại
        if (completedQuestions === 25 && !claimed.includes(25)) {
          triggerLevelUpEvent(25, 6);
          return;
        }

        // Mốc 6: ĐÃ HOÀN THÀNH ĐỦ 30 CÂU!
        if (completedQuestions >= 30) {
          handleJourneyComplete();
          return;
        }

        // Tiến tới câu hỏi tiếp theo bình thường
        moveToNextQuestionIndex(completedQuestions);
      };

      // Hoàn thành xuất sắc 30 câu hỏi!
      const handleJourneyComplete = () => {
        window.rpgSound.playVictory();
        confetti({ particleCount: 220, spread: 120, origin: { y: 0.5 } });

        const totalEarnedGold = journeySession.accumulatedGold + 100; // Thưởng hoàn thành
        const totalEarnedExp = journeySession.accumulatedExp + 150;

        // Lưu vào hero
        let newExp = hero.exp + totalEarnedExp;
        let newLevel = hero.level;
        let newMaxExp = hero.maxExp;
        let didLevelUp = false;

        if (newExp >= newMaxExp) {
          newLevel += 1;
          newExp -= newMaxExp;
          newMaxExp = Math.round(newMaxExp * 1.35);
          didLevelUp = true;
          window.rpgSound.playLevelUp();
        }

        setHero(prev => ({
          ...prev,
          level: newLevel,
          exp: newExp,
          maxExp: newMaxExp,
          gold: prev.gold + totalEarnedGold,
          gems: prev.gems + 20,
          studyStats: {
            ...prev.studyStats,
            totalAnswered: prev.studyStats.totalAnswered + 30,
            totalCorrect: prev.studyStats.totalCorrect + journeySession.correctCount,
            bossesDefeated: prev.studyStats.bossesDefeated + 1
          }
        }));

        // Nếu người chơi đã đăng nhập, ghi nhận mốc 30 và lưu toàn bộ kết quả bài làm lên cơ sở dữ liệu
        if (window.EduQuestAuth && window.EduQuestAuth.isLoggedIn() && journeySession) {
          const runId = journeySession.runId || ('journey_' + journeySession.startTime);
          // 1. Nhận thưởng mốc 30 hoàn thành hành trình
          window.EduQuestAuth.claimMilestoneReward(runId, 30, 100, 150, null, 'Huy Chương Đại Dũng Sĩ').catch(err => {
            console.warn("Milestone 30 claim notification:", err);
          });

          // 2. Lưu kết quả học tập vào sổ học bạ trên server
          const sessionPayload = {
            setId: journeySession.setId || 'set_grade3_math',
            setTitle: journeySession.setTitle || 'Hành trình Tri Thức 30 câu',
            mode: 'journey_30',
            durationSeconds: Math.round((Date.now() - (journeySession.startTime || Date.now())) / 1000),
            totalQuestions: 30,
            correctCount: journeySession.correctCount || 0,
            wrongCount: journeySession.wrongCount || 0,
            accuracy: Math.round(((journeySession.correctCount || 0) / 30) * 100),
            earnedExp: totalEarnedExp,
            earnedGold: totalEarnedGold,
            questionAttempts: (journeySession.answersHistory || []).map((h, idx) => ({
              questionId: `q_${idx + 1}`,
              questionText: h.question || `Câu ${idx + 1}`,
              userAnswer: h.chosenAnswer,
              correctAnswer: h.correctAnswer,
              isCorrect: h.isCorrect ? 1 : 0,
              timeSpentSeconds: 5,
              attemptNumber: 1
            }))
          };

          window.EduQuestAuth.submitLearningSession(sessionPayload).then(() => {
            loadServerPlayerData(); // Đồng bộ lại ví và nhân vật từ server
          }).catch(err => {
            console.error("Lỗi gửi kết quả học tập lên server:", err);
          });
        }

        // Xóa session đã hoàn thành để tránh nhận thưởng trùng

        setOpenedChest(false);
        setChestRewardItem(null);

        setScreen('journey_victory');

      const usePotion = (item) => {
        window.rpgSound.playClick();
        const isJourney = screen === 'journey_battle';

        if (item.effect === 'healHp') {
          const healAmount = item.value || 60;
          if (isJourney && journeySession) {
            setJourneySession(prev => ({
              ...prev,
              heroCurrentHp: Math.min(calculatedStats.maxHp, prev.heroCurrentHp + healAmount)

            setCurrentBattle(prev => ({
              ...prev,
              heroCurrentHp: Math.min(calculatedStats.maxHp, prev.heroCurrentHp + healAmount)
            }));

          window.rpgSound.playHeal();

              ...prev,
              heroCurrentMp: Math.min(calculatedStats.maxMp, prev.heroCurrentMp + manaAmount)

              heroCurrentMp: Math.min(calculatedStats.maxMp, prev.heroCurrentMp + manaAmount)

          }
          window.rpgSound.playHeal();

        setHero(prev => {
          const nextInv = prev.inventory.map(i => {
            if (i.id === item.id) return { ...i, count: (i.count || 1) - 1 };
            return i;
          }).filter(i => i.count > 0);
          return { ...prev, inventory: nextInv };
        });

        if (openedChest) return;
        window.rpgSound.playChestOpen();

        const possibleDrops = [
          window.RPG_DATA.shopItems.find(i => i.id === 'wp-4'),
          window.RPG_DATA.shopItems.find(i => i.id === 'ar-1'),
          window.RPG_DATA.shopItems.find(i => i.id === 'ac-1'),
          window.RPG_DATA.shopItems.find(i => i.id === 'ar-3')
        ].filter(Boolean);

        const reward = possibleDrops[Math.floor(Math.random() * possibleDrops.length)];
        setChestRewardItem(reward);

        setHero(prev => {
          const newInv = [...prev.inventory];
          const exists = newInv.find(i => i.id === reward.id);
          if (exists) {
            exists.count = (exists.count || 1) + 1;
          } else {
            newInv.push({ ...reward, count: 1 });
          }
          return { ...prev, inventory: newInv };

        confetti({ particleCount: 100, spread: 70, origin: { y: 0.5 } });
      };

        window.rpgSound.playClick();

          setShowAuthModal(true);
          setAuthError("Vui lòng đăng nhập tài khoản để giao dịch và lưu vật phẩm vào kho đồ cá nhân trên máy chủ!");
          return;
        }

        const catalogIdMap = {
          'wp-1': 'item_sword_basic',
          'wp-2': 'item_sword_flame',
          'wp-3': 'item_staff_magic',
          'wp-4': 'item_sword_flame',
          'ar-1': 'item_armor_iron',
          'ar-2': 'item_shield_knowledge',
          'ar-3': 'item_shield_knowledge',
          'pot-1': 'item_potion_hp',
          'pot-2': 'item_potion_mp'
        };
        const serverItemId = catalogIdMap[item.id] || item.id;

        try {
          const res = await window.EduQuestAuth.fetchWithAuth('/api/shop/buy', {
            method: 'POST',
            body: JSON.stringify({ itemId: serverItemId })
          });
          const result = await res.json();

            window.rpgSound.playBuyItem();
            alert(`🎉 Giao dịch thành công! Đã mua ${result.item ? result.item.name : item.name} và ghi nhận vào ví máy chủ.`);

            alert(`❌ Giao dịch thất bại: ${result.error}`);

                {[
                  { id: 'landing', icon: '🏰', label: 'Trang Chủ' },
                  { id: 'world_map', iconImg: '/assets/items/quest_scroll.png', label: 'Bản Đồ 10 Ải' },
                  { id: 'journey_select_set', iconImg: '/assets/items/sword.png', label: '30 Câu RPG' },
                  { id: 'profile', iconImg: heroClassData.avatar, label: 'Anh Hùng' },
                  { id: 'inventory', iconImg: '/assets/items/chest_closed.png', label: 'Túi Đồ' },
                  { id: 'shop', iconImg: '/assets/items/gold_coins.png', label: 'Cửa Hàng' },
                  { id: 'dashboard', iconImg: '/assets/items/spellbook.png', label: 'Học Tập' },
                  { id: 'settings', icon: '⚙️', label: 'Cài Đặt' }
                ].map(nav => {
                  const isActive = screen === nav.id;
                  return (
                    <button key={nav.id} onClick={() => {
                      window.rpgSound.playClick();
                      if (nav.id === 'journey_select_set') {
                        loadPublishedQuestionSets();
                      }
                      setScreen(nav.id);
                    }} class={`flex flex-col items-center py-1 px-2.5 rounded-2xl transition transform active:scale-95 ${
                      isActive ? 'bg-amber-500/20 text-amber-300 font-black' : 'text-gray-400 hover:text-white'
                    }`}>
                      {nav.iconImg ? (
                        <img src={nav.iconImg} class="w-5 h-5 object-contain" />
                      ) : (
                        <span class="text-lg">{nav.icon}</span>
                      )}
                      <span class="text-[9px] mt-0.5 tracking-tight font-bold">{nav.label}</span>
                    </button>
                  );
                })}
              </div>
            </nav>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
